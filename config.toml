baseURL = "https://tomjagotjarvis.com/"
title = "Tom Jagot-Jarvis"
locale = "en-GB"
enableRobotsTXT = true
publishDir = "public"
uglyURLs = false
relativeURLs = true
canonifyURLs = false
ignoreFiles = ['\.bak(\..*)?$', '(^|/)\.DS_Store$']

pagination.pagerSize = 6

[taxonomies]
  tag = "tags"

[minify]
  disableXML = true

[params]
  description = "Travel photography by Tom Jagot-Jarvis."
  postImageMax = 1500
  postImageGutter = 24
