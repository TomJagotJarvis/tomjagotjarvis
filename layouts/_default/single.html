{{ define "main" }}
<article class="post">
  <div class="text-container">
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>

    {{ with .GetTerms "tags" }}
    <div class="tags-inline">
      {{ range . }}
        <a class="tag-link" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      {{ end }}
    </div>
    {{ end }}

    <div class="post-body">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
